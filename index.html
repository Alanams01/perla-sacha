<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Perla & Sacha</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --fuchsia: #D82D7E;
            --coral: #FF7F50;
            --amber: #B8860B;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #111;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('couple.jpg') no-repeat center center / cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.45);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3.5rem, 10vw, 7rem);
            color: #fff;
            text-shadow: 0 2px 20px rgba(0,0,0,0.4);
            line-height: 1;
            letter-spacing: 2px;
        }

        .countdown {
            display: flex;
            gap: 10px;
        }

        .countdown-item {
            background: rgba(30,30,30,0.85);
            border-radius: 8px;
            padding: 12px 18px;
            min-width: 72px;
            text-align: center;
        }

        .countdown-num {
            font-size: 2rem;
            font-weight: 600;
            color: #fff;
            line-height: 1;
            display: block;
        }

        .countdown-label {
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #aaa;
            margin-top: 4px;
            display: block;
        }

        .date-text {
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: rgba(255,255,255,0.85);
            text-transform: uppercase;
            font-weight: 300;
        }

        .cta {
            display: inline-block;
            padding: 16px 52px;
            background: linear-gradient(45deg, var(--fuchsia), var(--coral));
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            box-shadow: 0 8px 30px rgba(216,45,126,0.45);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(216,45,126,0.6);
        }

        @media (max-width: 480px) {
            .countdown-item { min-width: 58px; padding: 10px 12px; }
            .countdown-num { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="hero-content">
        <h1>Perla &amp; Sacha</h1>

        <div class="countdown">
            <div class="countdown-item">
                <span class="countdown-num" id="days">00</span>
                <span class="countdown-label">Jours</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-num" id="hours">00</span>
                <span class="countdown-label">Heures</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-num" id="minutes">00</span>
                <span class="countdown-label">Min</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-num" id="seconds">00</span>
                <span class="countdown-label">Sec</span>
            </div>
        </div>

        <p class="date-text">25 Juin 2026</p>

        <a href="invitation.html" class="cta">Voir l'invitation</a>
    </div>
</div>

<script>
    const target = new Date('2026-06-25T17:00:00');
    function pad(n) { return String(n).padStart(2, '0'); }
    function tick() {
        const diff = target - Date.now();
        if (diff <= 0) return;
        document.getElementById('days').textContent    = pad(Math.floor(diff / 86400000));
        document.getElementById('hours').textContent   = pad(Math.floor((diff % 86400000) / 3600000));
        document.getElementById('minutes').textContent = pad(Math.floor((diff % 3600000) / 60000));
        document.getElementById('seconds').textContent = pad(Math.floor((diff % 60000) / 1000));
    }
    tick();
    setInterval(tick, 1000);
</script>
</body>
</html>
